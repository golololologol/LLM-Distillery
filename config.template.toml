# ─────────────────────────────────────────────────────────────────────────────
# LLM-Distillery Configuration Template
# ─────────────────────────────────────────────────────────────────────────────
# Copy this file to config.toml and fill in your paths.
# Most defaults are safe for a single-GPU setup.
# ─────────────────────────────────────────────────────────────────────────────

# Optional: Jinja2 chat template override. If your tokenizer already has a
# built-in template (most modern models do), leave this commented out.
# chat_template = "{% for message in messages %}..."


# ── Paths ────────────────────────────────────────────────────────────────────

# Directory where all cache data (preprocessed datasets, checkpoints, etc.)
# will be stored. Should ideally start empty.
cache_folder = "cache"

# Training dataset in JSONL format (one conversation per line).
# Auto-detects format: OpenAI messages, ShareGPT, Alpaca instruct, or completion/raw text.
dataset_path = "path/to/your/dataset.jsonl"

# Validation dataset in the same format.
validation_dataset_path = "path/to/your/validation.jsonl"

# Path to a single teacher config file, or a directory of teacher configs.
teacher_configs_path = "teacher_configs/your_teacher.toml"

# Path to the student model config file.
student_config_path = "student_configs/your_student.toml"


# ── General model settings ───────────────────────────────────────────────────

# Context length (in tokens) for collection and training.
# Override precedence: teacher config context_len > this value (for collection),
#                      student config context_len > this value (for training).
# Teacher and student configs can each set their own context_len to override
# this pipeline-level default.
context_len = 2048

# Which conversation roles to save distributions for. You probably only need just "assistant".
save_roles = ["assistant"]

# When true, skip interactive confirmation prompts during dataset operations.
auto_approve = false


# ── Collection settings ──────────────────────────────────────────────────────

# Chunk sizes for byte marginalization (tokens processed at once).
# Lower = less VRAM, slightly slower. 256 is a good default.
marg_chunk_inference = 256
marg_chunk_training = 256


# ── Training settings ────────────────────────────────────────────────────────

num_epochs = 1
num_warmup_steps = 50
batch_size = 4

# Accumulate gradients over this many batches before stepping.
# Effective batch size = batch_size * grad_accum_batches.
grad_accum_batches = 2

# Trade compute for VRAM. Almost always worth enabling.
grad_checkpointing = true

max_grad_norm = 5.0

# torch.compile — set to true for faster training AFTER your first run works.
# First compilation takes a long time (minutes). Leave false for initial setup.
# torch_compile = false
# torch_compile_mode = "default"
# torch_compile_backend = "inductor"

# Liger Kernel: fused Triton ops (RMSNorm, RoPE, SwiGLU). Requires liger-kernel and triton to be b.
liger_kernel = false

# Temperature for teacher logit collection.
# Override precedence: teacher config `temperature` field > this value.
# Higher values soften the distribution, exposing more of the probability mass
# to the student. 1.0 is the safe default (no scaling).
collection_temperature = 1

# Temperature for student logits during training. Defaults to 1.0.
# If you set collection_temperature != training_temperature, make sure you
# understand the implications — mismatched temperatures mean the student sees
# a different distribution shape than what it's optimizing against.
training_temperature = 1

lr = 4e-6
adam_betas = [0.9, 0.99]
adam_decay = 2e-3

# Start decaying LR to 0 at this fraction of total steps for WSD scheduler (0.9 = last 10%).
lr_decay_start = 0.9

# Weighting factor for composite losses (abomination loss).
alpha = 0.5

# Loss function. Options: "abomination", "skew_kl", "akl"
loss_type = "abomination"

# Per-position loss weighting by teacher entropy. Downweights sparse positions
# from tokenizer boundary mismatches. Disabled by default for backward compat.
entropy_weighting = false

# LR scheduler. Options: "wsd", "cosine", etc.
lr_scheduler = "wsd"

# Optimizer. Options: "adamw", "adamw8bit", "apollomini", "muon", etc.
optimizer = "apollomini"

# Sample ordering. Options: "shuffle", "random", "sorted"
data_order = "random"

# Training precision. Options: "bf16", "fp16", "fp32", "4bit", "8bit"
training_precision = "bf16"

# Which teacher(s) to train on.
# "auto" = single teacher uses it directly, multiple teachers merges all with per-teacher weights.
# Can be a specific teacher name, or a list of teacher names to merge a subset: ["teacher1", "teacher2"]
train_on = "auto"

# Multi-GPU strategy. Options: "ddp", "fsdp2", "naive_layer_split"
training_strategy = "ddp"

seed = 42


# ── Validation & Saving ──────────────────────────────────────────────────────

# How often to validate (in epochs). 0.1 = every 10% of an epoch.
validate_every_n_epochs = 0.1

# Metric for selecting "best" checkpoint. Options: "train_loss", "ce", "kl"
best_metric = "train_loss"

# How often to save the student model (in epochs).
save_student_every_n_epochs = 1.0

# Save model when a new best validation score is reached.
save_best_model = true

# Also save the full training state (optimizer, scheduler) on best validation.
save_best_state = false

# Keep only the N most recent checkpoints. Older ones are DELETED.
# Set to a higher number if you want to keep more history.
# Comment out (or remove) to keep all checkpoints.
keep_last_n_checkpoints = 2


# ── Multi-GPU / Device settings ─────────────────────────────────────────────

# Only needed when device_map = "custom". Sets how many layers go on GPU 0
# (which also holds embeddings/head). Leave commented out for auto placement.
# num_gpu0_layers = 9

# Device placement strategy. "auto" or "balanced" work for most setups.
# Use "custom" with num_gpu0_layers for manual control.
device_map = "balanced"

# Enable multi-GPU training (naive/DDP/FSDP).
multi_gpu = false

# Weights & Biases logging. Leave empty to disable the comment.
wandb_comment = ""
wandb_project = "LLM Distillation"


# Per-device VRAM limits. Keys are GPU indices (0, 1, ...) or "cpu".
# Examples:
#   24GB GPUs:  0 = "22GB", 1 = "22GB"
#   16GB GPUs:  0 = "14GB"
#   Leave some headroom (~2GB) for PyTorch overhead.
# Comment out the entire section if you don't need to cap memory.
# [max_memory]
# 0 = "22GB"
# 1 = "22GB"
# cpu = "60GB"
